[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "indeng"
version = "0.1.0"
description = "Simulations de flux d'usine et ordonnancement bases sur la Theorie des Contraintes (SimPy)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "simpy>=4.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
indeng = "indeng.cli:main"

[tool.setuptools.packages.find]
include = ["indeng*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
